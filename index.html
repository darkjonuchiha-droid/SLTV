<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SLTV</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1rem; background: radial-gradient(ellipse at center, #101418 0%, #05070a 100%);
      color: #dfe8f2; font: 400 16px/1.6 system-ui, sans-serif; text-align: center; padding: 2rem;
    }
    h1 { font-size: 3rem; letter-spacing: .3em; color: #fff; }
    p { max-width: 34rem; color: #8fa3b8; }
    a { color: #6db3f2; }
  </style>
</head>
<body>
  <h1>SLTV</h1>
  <p>A synced watch-party TV for Second Life, powered by Kosmi rooms —
     shared viewing <em>and</em> shared controls: fullscreen, channel, and power
     follow the remote for every watcher.</p>
  <p>This site hosts the TV's web assets. The TV itself runs on a prim in
     Second Life — see the
     <a href="https://github.com/darkjonuchiha-droid/SLTV">project repository</a>
     for setup.</p>
</body>
</html>
